services:
  postgres:
    image: postgres:16-alpine
    container_name: medical-records-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: medrecords
      POSTGRES_PASSWORD: medrecords
      POSTGRES_DB: medrecords
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
